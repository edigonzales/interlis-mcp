name: build and publish container images

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

env:
  # Image versions follow the Gradle versioning scheme: <major>.<minor>.<run>.
  IMAGE_VERSION_PREFIX: '0.0'
  LOCAL_NATIVE_IMAGE: interlis-mcp:ci
  LOCAL_JVM_IMAGE: interlis-mcp-jvm:ci
  DOCKERHUB_NATIVE_IMAGE: docker.io/sogis/interlis-mcp
  DOCKERHUB_JVM_IMAGE: docker.io/sogis/interlis-mcp-jvm
  GHCR_NATIVE_IMAGE: ghcr.io/sogis/interlis-mcp
  GHCR_JVM_IMAGE: ghcr.io/sogis/interlis-mcp-jvm

jobs:
  application-checks:
    runs-on: ubuntu-24.04

    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run unit and end-to-end tests
        run: ./gradlew clean test e2eTest --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: warn

  build-and-smoke-test:
    needs: application-checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Determine image version
        id: image
        shell: bash
        run: echo "version=${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Each architecture is built on its own runner: the native image compile is
      # CPU and memory heavy and must not run under emulation.
      - name: Build JVM image for verification
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: jvm-runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_JVM_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=interlis-mcp-jvm-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=interlis-mcp-jvm-${{ matrix.architecture }}

      - name: Build native image for verification
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: native-runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_NATIVE_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=interlis-mcp-native-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=interlis-mcp-native-${{ matrix.architecture }}

      # The smoke test drives every MCP tool over STDIN/STDOUT and fails if
      # anything other than JSON-RPC appears on STDOUT.
      - name: Smoke test JVM image over STDIO
        run: python3 tools/test-mcp-stdio.py docker run --rm -i "$LOCAL_JVM_IMAGE"

      - name: Smoke test native image over STDIO
        run: python3 tools/test-mcp-stdio.py docker run --rm -i "$LOCAL_NATIVE_IMAGE"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish smoke-tested architecture images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail

          publish_architecture_image() {
            local source_image="$1"
            local dockerhub_image="$2"
            local ghcr_image="$3"
            local architecture_tag="${IMAGE_VERSION}-${IMAGE_ARCHITECTURE}"

            docker tag "$source_image" "${dockerhub_image}:${architecture_tag}"
            docker tag "$source_image" "${ghcr_image}:${architecture_tag}"
            docker push "${dockerhub_image}:${architecture_tag}"
            docker push "${ghcr_image}:${architecture_tag}"
          }

          publish_architecture_image "$LOCAL_NATIVE_IMAGE" "$DOCKERHUB_NATIVE_IMAGE" "$GHCR_NATIVE_IMAGE"
          publish_architecture_image "$LOCAL_JVM_IMAGE" "$DOCKERHUB_JVM_IMAGE" "$GHCR_JVM_IMAGE"

  publish-multiarch-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-smoke-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Determine image version
        id: image
        shell: bash
        run: echo "version=${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned multiarch manifests
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          publish_manifest() {
            local image="$1"
            docker buildx imagetools create \
              --tag "${image}:${IMAGE_VERSION}" \
              "${image}:${IMAGE_VERSION}-amd64" \
              "${image}:${IMAGE_VERSION}-arm64"
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            publish_manifest "$image"
          done

      - name: Verify multiarch manifests before updating latest
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          verify_multiarch_manifest() {
            local image="$1"
            local tag="$2"
            local manifest

            manifest="$(docker buildx imagetools inspect "${image}:${tag}")"
            printf '%s\n' "$manifest"
            if ! grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:${tag} is missing linux/amd64." >&2
              return 1
            fi
            if ! grep -Eq 'Platform:[[:space:]]+linux/arm64(/v[0-9]+)?([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:${tag} is missing linux/arm64." >&2
              return 1
            fi
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            verify_multiarch_manifest "$image" "$IMAGE_VERSION"
          done

      - name: Publish latest multiarch manifests
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          publish_latest_manifest() {
            local image="$1"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              "${image}:${IMAGE_VERSION}-amd64" \
              "${image}:${IMAGE_VERSION}-arm64"
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            publish_latest_manifest "$image"
          done

      - name: Verify published latest manifests
        shell: bash
        run: |
          set -euo pipefail

          verify_multiarch_manifest() {
            local image="$1"
            local manifest

            manifest="$(docker buildx imagetools inspect "${image}:latest")"
            printf '%s\n' "$manifest"
            if ! grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:latest is missing linux/amd64." >&2
              return 1
            fi
            if ! grep -Eq 'Platform:[[:space:]]+linux/arm64(/v[0-9]+)?([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:latest is missing linux/arm64." >&2
              return 1
            fi
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            verify_multiarch_manifest "$image"
          done
