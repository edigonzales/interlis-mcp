name: verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_VERSION: 0.0.${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon clean check e2eTest bootJar
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
        with:
          platforms: arm64
      - name: Smoke test each container architecture over HTTP
        shell: bash
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load -f docker/Dockerfile -t interlis-mcp:ci \
              --build-arg "IMAGE_VERSION=$IMAGE_VERSION" --build-arg "GIT_COMMIT=$GITHUB_SHA" \
              --build-arg "SOURCE_REPOSITORY=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
            container=$(docker run --platform "linux/$arch" -d -p 127.0.0.1::8080 interlis-mcp:ci)
            trap 'docker rm -f "$container" >/dev/null' EXIT
            address=$(docker port "$container" 8080/tcp)
            if ! python3 tools/mcp-smoke.py "http://$address/mcp"; then
              docker logs "$container"
              exit 1
            fi
            docker rm -f "$container" >/dev/null
            trap - EXIT
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interlis-mcp-jar
          path: build/libs/interlis-mcp.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: test-reports
          path: build/reports/

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: interlis-mcp-jar
          path: build/libs
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/sogis/interlis-mcp:${{ env.IMAGE_VERSION }}
            docker.io/sogis/interlis-mcp:latest
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_VERSION }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
