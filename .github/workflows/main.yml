name: verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_VERSION: 0.0.${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon clean check e2eTest bootJar
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Smoke test each container architecture over HTTP
        shell: bash
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load -f docker/Dockerfile -t interlis-mcp:ci \
              --build-arg "IMAGE_VERSION=$IMAGE_VERSION" --build-arg "GIT_COMMIT=$GITHUB_SHA" \
              --build-arg "SOURCE_REPOSITORY=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
            container=$(docker run --platform "linux/$arch" -d -p 127.0.0.1::8080 interlis-mcp:ci)
            trap 'docker rm -f "$container" >/dev/null' EXIT
            address=$(docker port "$container" 8080/tcp)
            if ! python3 tools/mcp-smoke.py "http://$address/mcp"; then
              docker logs "$container"
              exit 1
            fi
            docker rm -f "$container" >/dev/null
            trap - EXIT
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interlis-mcp-jar
          path: build/libs/interlis-mcp.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: build/reports/

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interlis-mcp-jar
          path: build/libs
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/sogis/interlis-mcp:${{ env.IMAGE_VERSION }}
            docker.io/sogis/interlis-mcp:latest
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_VERSION }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
