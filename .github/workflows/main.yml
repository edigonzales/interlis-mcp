name: build and publish

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run unit and end-to-end tests
        run: ./gradlew clean test e2eTest --no-daemon
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: warn

# Publishing the container images lives in container-image.yml. It builds the
# JVM and GraalVM native variants for linux/amd64 and linux/arm64, smoke tests
# every image over STDIO and merges the architecture images into multi-arch
# manifests.
