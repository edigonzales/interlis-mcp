spring.main.web-application-type=none
spring.main.banner-mode=off

spring.ai.mcp.server.name=interlis-mcp
spring.ai.mcp.server.version=${mcpServerVersion}
spring.ai.mcp.server.request-timeout=1h
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=Tools zum Erzeugen von INTERLIS-Modellgeruests.
