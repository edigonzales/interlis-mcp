spring.main.web-application-type=none
spring.main.banner-mode=off

spring.ai.mcp.server.name=interlis-mcp
spring.ai.mcp.server.version=${mcpServerVersion}
spring.ai.mcp.server.request-timeout=1h
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=Fachwerkzeuge zum Erstellen, Analysieren, Aendern, Pruefen und Testen von INTERLIS-Modellen.

interlis.knowledge.model-paths=
interlis.knowledge.max-model-bytes=1048576
interlis.knowledge.max-search-results=10
