- profile: CORE
  id: MDE-602
  title: UNIQUE-Bedingungen fachlich pruefen
  severity: INFO
  appliesTo: ANY
  checkKind: MANUAL
  sourceUrl: https://sogis.github.io/modellbasierte-datenerfassung-handbuch/index.html#_modellierungsregeln
  sourceSection: 6.6 Konsistenzbedingungen (#602)
  rationale: UNIQUE-Bedingungen muessen dort modelliert werden, wo die Fachsemantik Eindeutigkeit verlangt.
  recommendation: Pruefe fachliche Schluessel und ergaenze UNIQUE-Bedingungen, wenn Eindeutigkeit eine Domaenenanforderung ist.
- profile: CORE
  id: MDE-603
  title: Konkrete Klassen mit Objektidentifikation modellieren
  severity: WARNING
  appliesTo: ANY
  checkKind: AUTOMATED
  sourceUrl: https://sogis.github.io/modellbasierte-datenerfassung-handbuch/index.html#_modellierungsregeln
  sourceSection: 6.6 Konsistenzbedingungen (#603)
  rationale: Objekte muessen gemaess Handbuch eine eindeutige Objektidentifikation besitzen; INTERLIS.UUIDOID ist die uebliche Wahl.
  recommendation: Definiere fuer jede konkrete Klasse eine effektive OID-Domain, in der Regel ueber OID AS INTERLIS.UUIDOID auf Klassen- oder Topic-Ebene.
