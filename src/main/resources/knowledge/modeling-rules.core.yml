- profile: CORE
  id: MDE-502
  title: TEXT mit konkreter Laenge modellieren
  severity: WARNING
  appliesTo: ANY
  checkKind: AUTOMATED
  sourceUrl: https://sogis.github.io/modellbasierte-datenerfassung-handbuch/index.html#_modellierungsregeln
  sourceSection: 6.5 Einschraenkungen zum Gebrauch von INTERLIS 2.3 (#502)
