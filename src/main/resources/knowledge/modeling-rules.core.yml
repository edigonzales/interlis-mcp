- profile: CORE
  id: MDE-302
  title: Namen von Modellelementen kurz halten
  severity: INFO
  appliesTo: ANY
  checkKind: AUTOMATED
  sourceUrl: https://sogis.github.io/modellbasierte-datenerfassung-handbuch/index.html#_modellierungsregeln
  sourceSection: 6.3 Namenskonvention (#302)
  rationale: Namen von Topics, Klassen, Assoziationen und Attributen sollten nicht laenger als 29 Zeichen sein.
