- profile: CORE
  id: MDE-208
  title: Modellversion angeben
  severity: WARNING
  appliesTo: ANY
  checkKind: AUTOMATED
  sourceUrl: https://sogis.github.io/modellbasierte-datenerfassung-handbuch/index.html#_modellierungsregeln
  sourceSection: 6.2 Modellname / Version / Formatierung (#208)
  rationale: Die Modellversion ist als VERSION-Datum anzugeben, damit Modellstaende eindeutig identifizierbar sind.
