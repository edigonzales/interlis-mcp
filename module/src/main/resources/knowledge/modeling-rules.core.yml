- profile: CORE
  id: MDE-020
  title: Vollständiges Modell mit ili2c validieren
  severity: ERROR
  appliesTo: ANY
  checkKind: AUTOMATED
  sourceUrl: https://github.com/edigonzales/interlis-mcp
  sourceSection: Technisches Compiler-Gate
  rationale: Ein INTERLIS-Modell ist technisch erst nutzbar, wenn es mit ili2c kompiliert.
  recommendation: Behebe alle ili2c-ERROR-Meldungen; verwende dafür den passenden High-Level-Review oder gezielt validateIliModel.
- profile: CORE
  id: MDE-040
  title: Fachliche Regeln nicht erfinden
  severity: WARNING
  appliesTo: ANY
  checkKind: MANUAL
  sourceUrl: https://github.com/edigonzales/interlis-mcp
  sourceSection: Grenze des agentischen Arbeitsablaufs
  rationale: Kardinalitäten, Rollen und Constraints sind fachliche Aussagen und dürfen nicht aus technischen Platzhaltern abgeleitet werden.
  recommendation: Frage nach oder dokumentiere Annahmen, bevor fachliche Kardinalitäten, Rollen oder Constraints modelliert werden.
