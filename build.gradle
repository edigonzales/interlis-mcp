plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'ch.so.agi'
version = providers.environmentVariable('IMAGE_VERSION').getOrElse('0.0.LOCALBUILD')
def serverVersion = version.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://jars.interlis.guru/mirror') }
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    // Spring AI 2.0.1 uses MCP SDK 2.0.0 by default; keep the server on 2.0.1.
    implementation platform('io.modelcontextprotocol.sdk:mcp-bom:2.0.1')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc:2.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.jspecify:jspecify'
    implementation 'ch.ehi:ehibasics:1.4.1'
    // Ili23Parser exposes ANTLR's LLkParser on the compile classpath.
    implementation 'antlr:antlr:2.7.7'
    implementation 'ch.interlis:ili2c-core:5.6.8'
    implementation 'ch.interlis:ili2c-tool:5.6.8'
    implementation 'ch.interlis:iox-ili:1.24.4'
    implementation 'ch.interlis:ilivalidator:1.14.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    e2e {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    e2eImplementation.extendsFrom testImplementation
    e2eRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('processResources') {
    inputs.property('mcpServerVersion', serverVersion)
    filesMatching('application.properties') {
        expand(mcpServerVersion: serverVersion)
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    archiveFileName = 'interlis-mcp.jar'
    from('LICENSE') { into 'META-INF' }
}

tasks.named('bootRun') { standardInput = System.in }

tasks.register('e2eTest', Test) {
    description = 'Exercises the executable JAR over MCP STDIO.'
    group = 'verification'
    inputs.file(tasks.named('bootJar').flatMap { it.archiveFile })
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    shouldRunAfter tasks.test
    systemProperty 'expectedProjectVersion', serverVersion
}

tasks.register('buildImage', Exec) {
    group = 'docker'
    description = 'Builds the local container image from the executable JAR.'
    dependsOn tasks.bootJar
    def revision = providers.exec {
        commandLine 'git', 'rev-parse', 'HEAD'
        ignoreExitValue = true
    }
    def commit = revision.result.get().exitValue == 0 ? revision.standardOutput.asText.get().trim() : 'unknown'
    commandLine 'docker', 'build', '-f', 'docker/Dockerfile',
        '-t', "sogis/interlis-mcp:${serverVersion}", '-t', 'sogis/interlis-mcp:latest',
        '--build-arg', "IMAGE_VERSION=${serverVersion}", '--build-arg', "GIT_COMMIT=${commit}", '.'
}
